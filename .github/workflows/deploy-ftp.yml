name: Deploy to FTP

on:
  push:
    branches: [main]
    # 只有会改线上行为的两类文件才触发部署：避免改 README 也去传一遍 FTP、打一遍冒烟
    paths:
      - index.html
      - _proxy.php
      - .github/workflows/deploy-ftp.yml
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 语法校验
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -l _proxy.php

      - name: Upload tracked files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "缺少 FTP_SERVER / FTP_USERNAME / FTP_PASSWORD 仓库密钥" >&2
            exit 1
          fi
          # 服务器 pure-ftpd 使用 1024 位自签证书（EE certificate key too weak），无法做 CA 校验，
          # 因此用 --insecure 跳过链路校验，改用 --pinnedpubkey 钉死服务器公钥指纹，
          # 指纹不符直接失败。服务器更换证书后需同步更新下方指纹。
          # 传输为加密的显式 FTPS（--ssl-reqd），失败即中止，不会回退到明文。
          FTP_PIN="sha256//Noch62XpkaG3wLxSvRFi1C5vr++FI3S9dnpvvUcFwy8="
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*) continue ;;
            esac
            echo "→ $f"
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 90 \
              --ssl-reqd --insecure --pinnedpubkey "${FTP_PIN}" \
              --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --upload-file "$f" "ftp://${FTP_SERVER}:21/${f}"
          done
          echo "部署完成"

      - name: 线上冒烟测试
        # 不查真实号码：只用 ping 与非法号码验证「服务在线 + 参数校验生效」，
        # 避免把任何真实手机号写进 CI 日志。
        run: |
          set -euo pipefail
          BASE="https://a781927.xqryfh.cn/_proxy.php"
          ORIGIN="https://rdtscx.github.io"

          echo "--- ping ---"
          curl -fsS "${BASE}?ping=1"; echo

          echo "--- 预检 OPTIONS（期望 204）---"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X OPTIONS "${BASE}" \
            -H "Origin: ${ORIGIN}" -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type")
          echo "HTTP ${CODE}"; [ "${CODE}" = "204" ]

          echo "--- 白名单来源应回显 ACAO ---"
          curl -sSI -H "Origin: ${ORIGIN}" "${BASE}?ping=1" | tr -d '\r' | grep -i "^access-control-allow-origin: ${ORIGIN}$"

          echo "--- 非白名单来源应 403 ---"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "Origin: https://evil.example" "${BASE}?ping=1")
          echo "HTTP ${CODE}"; [ "${CODE}" = "403" ]

          echo "--- 非法号码应 400 ---"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" -X POST "${BASE}" \
            -H "Content-Type: application/json" -d '{"phone":"1"}')
          echo "HTTP ${CODE}"; [ "${CODE}" = "400" ]

          echo "--- 透传只允许上游接口（期望 403）---"
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" \
            "${BASE}?url=$(python3 -c "import urllib.parse;print(urllib.parse.quote('https://ysmapp.bj.10086.cn/evil/path',safe=''))")")
          echo "HTTP ${CODE}"; [ "${CODE}" = "403" ]

          echo "冒烟测试通过"
