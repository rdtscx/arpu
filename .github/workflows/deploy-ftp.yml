name: Deploy to FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 语法校验
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq php-cli >/dev/null
          php -l _proxy.php

      - name: Upload tracked files
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FTP_SERVER}" ] || [ -z "${FTP_USERNAME}" ] || [ -z "${FTP_PASSWORD}" ]; then
            echo "缺少 FTP_SERVER / FTP_USERNAME / FTP_PASSWORD 仓库密钥" >&2
            exit 1
          fi
          # 服务器 pure-ftpd 使用 1024 位自签证书（EE certificate key too weak），无法做 CA 校验，
          # 因此用 --insecure 跳过链路校验，改用 --pinnedpubkey 钉死服务器公钥指纹，
          # 指纹不符直接失败。服务器更换证书后需同步更新下方指纹。
          # 传输为加密的显式 FTPS（--ssl-reqd），失败即中止，不会回退到明文。
          FTP_PIN="sha256//Noch62XpkaG3wLxSvRFi1C5vr++FI3S9dnpvvUcFwy8="
          git ls-files -z | while IFS= read -r -d '' f; do
            case "$f" in
              .github/*) continue ;;
            esac
            echo "→ $f"
            curl --fail --silent --show-error \
              --retry 3 --retry-delay 2 --max-time 90 \
              --ssl-reqd --insecure --pinnedpubkey "${FTP_PIN}" \
              --ftp-create-dirs \
              --user "${FTP_USERNAME}:${FTP_PASSWORD}" \
              --upload-file "$f" "ftp://${FTP_SERVER}:21/${f}"
          done
          echo "部署完成"

      - name: 线上冒烟测试
        run: |
          set -e
          BASE="https://a781927.xqryfh.cn/_proxy.php"
          echo "--- ping ---"
          curl -fsS "${BASE}?ping=1"
          echo
          echo "--- 真实号码 ---"
          curl -fsS "${BASE}?phone=13901011112"
          echo
          echo "--- CORS 头 ---"
          curl -sSI -H "Origin: https://rdtscx.github.io" "${BASE}?ping=1" \
            | grep -i "access-control-allow-origin"
